- type: entity
  id: ActionMechCycleEquipment
  name: 切换设备
  description: 切换当前选择的设备
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_cycle_equip_on
    event: !type:MechToggleEquipmentEvent
    useDelay: 0.5

- type: entity
  id: ActionMechOpenUI
  name: 控制面板
  description: 打开舱内的控制面板
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_view_stats
    event: !type:MechOpenUiEvent
    useDelay: 1

- type: entity
  id: ActionMechEject
  name: 弹出
  description: 将驾驶员从舱内弹出
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_eject
    event: !type:MechEjectPilotEvent

- type: entity
  id: ActionRadarUiButton
  name: 质量扫描仪
  description: 扫描周围区域的质量特征。
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Objects/Tools/handheld_mass_scanner.rsi
      state: icon
    event: !type:MechRadarUiEvent
    useDelay: 0.5
