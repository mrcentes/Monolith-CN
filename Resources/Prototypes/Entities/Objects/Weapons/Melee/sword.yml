    - Katana
  - type: Sprite
    sprite: Objects/Weapons/Melee/katana.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 22
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: Objects/Weapons/Melee/katana.rsi
  - type: DisarmMalus
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage

- type: entity
  name: 能量武士刀 丨 energy katana
  parent: Katana
