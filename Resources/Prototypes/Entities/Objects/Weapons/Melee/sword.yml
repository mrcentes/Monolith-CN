- type: entity
  parent: BaseItem
  id: BaseSword
  abstract: true
  components:
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: MeleeWeapon
    wideAnimationRotation: -135
  - type: Sprite
    state: icon
  - type: Item
    size: Large
  - type: Utensil
    types:
      - Knife
  - type: Tool
    qualities:
    - Slicing

- type: entity
  name: 船长的军刀 丨 captain's sabre
  parent: BaseSword
  id: CaptainSabre
  description: 船长们的常见佩刀。原为礼仪用途，现多用于自卫防身。 丨 A common sighting among ship captains. Once ceremonial, it now has common use for self-defense.
  components:
  # Goobstation edit start
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/sabre_drop.ogg
  # Goobstation edit start
  - type: Sprite
    sprite: Objects/Weapons/Melee/captain_sabre.rsi
  - type: MeleeWeapon
    heavyStaminaCost: 2.5 # goob edit
    attackRate: 1.5
    damage:
      types:
        Slash: 27 #cmon, it has to be at least BETTER than the rest.
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: Item
    sprite: Objects/Weapons/Melee/captain_sabre.rsi
  - type: Tag
    tags:
    - CaptainSabre
  - type: DisarmMalus
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.0002 # 5,000 times less likely than 1 regular animal
  - type: PirateAccent
    # not putting a BlockMovement component here cause that's funny.
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage

- type: entity
  name: 武士刀 丨 katana
  parent: BaseSword
  id: Katana
  description: 由并非那么古老的可塑钢制成的古老工艺品。 丨 Ancient craftwork made with not so ancient plasteel.
