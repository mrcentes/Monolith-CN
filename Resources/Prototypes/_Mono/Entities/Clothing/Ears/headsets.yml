  id: ClothingHeadsetAltTsfmc
  name: 'TSFMC头戴式耳机 | TSFMC over-ear headset'
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyNfsd
      - EncryptionKeyCommand
