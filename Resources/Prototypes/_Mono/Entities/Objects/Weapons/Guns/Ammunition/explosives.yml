# Rockets

- type: entity
  id: CartridgeRocket
  name: PG-7VL榴弹
  parent: BaseItem
  description: 为RPG-7发射器设计的1.5倍弹头。呈管状外形。
  components:
  - type: Tag
    tags:
      - CartridgeRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: BulletRocket
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: rpg
  - type: StaticPrice
    price: 20

- type: entity
  id: CartridgeRocketSlow
  name: PG-7VL榴弹「蜗牛火箭」
  parent: BaseItem
  description: 为RPG-7发射器设计的1.5倍弹头 其飞行速度异常缓慢
  components:
    - type: Tag
      tags:
        - CartridgeRocket
    - type: Item
      size: Small
    - type: CartridgeAmmo
      proto: BulletWeakRocket
      deleteOnSpawn: true
    - type: Sprite
      sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: frag
    - type: StaticPrice
      price: 20

# Grenades

- type: entity
  id: BaseGrenade
  name: 基础手榴弹
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - Grenade
  - type: Item
    size: Small
  - type: Sprite

- type: entity
  id: 40mmGrenadeBaton
  name: '40mm 防暴弹 | 40mm baton grenade'
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeBaton
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: baton
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: baton
    suffix: false
  - type: Tag
    tags:
    - LessLethalGrenade

- type: entity
  id: 40mmGrenadeThermobaric
  name: '40mm 温压榴弹 | 40mm thermobaric grenade'
