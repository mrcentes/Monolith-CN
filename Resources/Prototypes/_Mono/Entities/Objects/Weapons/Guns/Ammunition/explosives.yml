  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeThermobaric
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: blast
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: blast
    suffix: false

- type: entity
  id: 40mmGrenadeFlash
  name: '40mm 闪光弹 | 40mm flash grenade'
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeFlash
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: flash
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: flash
    suffix: false
  - type: Tag
    tags:
    - LessLethalGrenade

- type: entity
  id: 40mmGrenadeFragmentation
  name: '40mm 杀伤榴弹 | 40mm Fragmentation grenade'
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeFragmentation
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: frag
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

- type: entity
  id: 40mmGrenadeEMP
  name: '40mm 电磁脉冲手榴弹 | 40mm EMP grenade'
  parent: BaseGrenade
  components:
