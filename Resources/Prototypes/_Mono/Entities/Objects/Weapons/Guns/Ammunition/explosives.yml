      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false
  - type: EmpDescription # Frontier
    range: 5 # Frontier
    energyConsumption: 2700000 # Frontier
    disableDuration: 10 # Frontier
  - type: Tag
    tags:
    - LessLethalGrenade

